<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ service_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <p class="site-title">{{ service_name }}</p>
  <nav class="tabs" aria-label="機能の切り替え">
    <a class="tab {% if active_tab == 'share' %}is-active{% endif %}"
       {% if active_tab == 'share' %}aria-current="page"{% endif %}
       href="{{ url_for('share_form') }}">共有する</a>
    <a class="tab {% if active_tab == 'receive' %}is-active{% endif %}"
       {% if active_tab == 'receive' %}aria-current="page"{% endif %}
       href="{{ url_for('receive_form') }}">受け取る</a>
  </nav>
</header>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>データの受け取り期限は共有してから{{ ttl_hours }}時間です。機密情報・個人情報の受け渡しには使用しないでください。</p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
