# /etc/nginx/conf.d/easy-sharing-limits.conf
#
# easy-sharing 用のレート制限ゾーン定義。http コンテキストに置く必要があるため
# サイト設定とは別ファイルにしている。ゾーンを定義するだけでは何も制限されず、
# 実際の制限は easy.ai-web-support.com の server ブロックで limit_conn /
# limit_req を書いた箇所にのみ効く。既存サイトには影響しない。

# 同時接続数の制限用（低速アップロードでワーカーを占有させないため）
limit_conn_zone $binary_remote_addr zone=easy_conn:5m;

# リクエスト頻度の制限用。アプリ側のレート制限（仕様 13.3）とは別の粗い防御。
limit_req_zone $binary_remote_addr zone=easy_req:5m rate=2r/s;
