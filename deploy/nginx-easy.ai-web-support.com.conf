# /etc/nginx/sites-available/easy.ai-web-support.com
# 既存の ai-web-support.com とは別ファイル。既存設定は変更しないこと。
#
# 配置後:
#   ln -s /etc/nginx/sites-available/easy.ai-web-support.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d easy.ai-web-support.com
# certbot が 443 の server ブロックと HTTP→HTTPS リダイレクトを追記する。

server {
    listen 80;
    server_name easy.ai-web-support.com;

    # 20 MiB をわずかに上回る上限（仕様 13.1）。アプリ側の上限と揃える。
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:5040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 20 MiB のアップロード・ダウンロードに備える
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
