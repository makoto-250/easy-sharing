# /etc/nginx/sites-available/easy.ai-web-support.com
# 既存の ai-web-support.com とは別ファイル。既存設定は変更しないこと。
#
# 配置後:
#   cp deploy/nginx-limits.conf /etc/nginx/conf.d/easy-sharing-limits.conf
#   ln -s /etc/nginx/sites-available/easy.ai-web-support.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d easy.ai-web-support.com
# certbot が 443 の server ブロックと HTTP→HTTPS リダイレクトを追記する。
# 一度 certbot を通したあとは、このファイルをそのまま上書きしないこと
# （certbot が書いた ssl_certificate 等が消える）。

server {
    listen 80;
    server_name easy.ai-web-support.com;

    # 20 MiB をわずかに上回る上限（仕様 13.1）。アプリ側の上限と揃える。
    client_max_body_size 21m;

    # 低速な送信でコネクションを長時間維持させない。
    # 値は「この時間なにも受信できなければ切る」であって全体の制限時間ではない。
    client_body_timeout 20s;
    client_header_timeout 10s;
    send_timeout 30s;

    # 同一IPからの同時接続数とリクエスト頻度の上限（ゾーンは conf.d で定義）。
    limit_conn easy_conn 10;
    limit_req zone=easy_req burst=30 nodelay;
    limit_conn_status 429;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:5040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # リクエストボディは nginx が受け切ってから gunicorn へ渡す（既定値）。
        # proxy_request_buffering off にすると、同期ワーカーが低速な
        # アップロードの間ずっと占有され、数接続で全ワーカーが枯渇する。
        proxy_request_buffering on;
        client_body_buffer_size 256k;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
